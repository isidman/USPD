name: deltos

on:
  pull_request:
    paths:
      - "deltos/**"
      - ".github/workflows/deltos.yml"
  push:
    branches: ["main"]
    paths:
      - "deltos/**"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deltos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build
